name: Auto Update ETF Data

on:
  schedule:
    # 월~금 한국시간 16:00 (UTC 07:00, 국내 주식/ETF 장마감 후 자동 실행)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼으로 언제든 즉시 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ETF Data Collector
        run: |
          python fetch_etf.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etfs.json js/default_data.js
          if git diff --staged --quiet; then
            echo "No data changes found."
          else
            git commit -m "chore: auto-update ETF live data [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
